name: verify compatibility fixtures

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-git:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Build the latest stable Git release
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential gettext libcurl4-openssl-dev libexpat1-dev libz-dev
          version="$(git ls-remote --tags --refs https://github.com/git/git.git | awk '{ sub("refs/tags/v", "", $2); if ($2 !~ /-/) print $2 }' | sort -V | tail -n 1)"
          git clone --depth 1 --branch "v${version}" https://github.com/git/git.git /tmp/git-source
          make -C /tmp/git-source -j2 prefix=/opt/git NO_TCLTK=YesPlease install
          /opt/git/bin/git --version
      - name: Verify fixture decisions against Git
        run: PATH="/opt/git/bin:${PATH}" go test -run '^TestGitCheckIgnoreCompatibility$' -count=1 ./...
