name: verify compatibility fixtures

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  latest-git:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Determine the latest stable Git version
        id: git-version
        run: |
          version="$(git ls-remote --tags --refs https://github.com/git/git.git | awk '{ sub("refs/tags/v", "", $2); if ($2 !~ /-/) print $2 }' | sort -V | tail -n 1)"
          test -n "$version"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Check the previous successful verification
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_VERSION: ${{ steps.git-version.outputs.version }}
        run: |
          run_id="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/verify-fixtures.yml/runs" \
            -f branch="$GITHUB_REF_NAME" -f status=success -f per_page=1 \
            --jq '.workflow_runs[0].id // empty')"
          skip=false
          if [ -n "$run_id" ]; then
            # A skipped verification carries forward the previous success for that version.
            skip="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" | \
              jq --arg name "Verify fixture decisions against Git v${GIT_VERSION}" \
              'any(.jobs[].steps[]; .name == $name and (.conclusion == "success" or .conclusion == "skipped"))')"
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
          if [ "$skip" = true ]; then
            echo "Git v${GIT_VERSION} was already verified; skipping." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check out repository
        if: steps.previous.outputs.skip != 'true'
        uses: actions/checkout@v4
      - name: Set up Go
        if: steps.previous.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Build the latest stable Git release
        if: steps.previous.outputs.skip != 'true'
        env:
          GIT_VERSION: ${{ steps.git-version.outputs.version }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential gettext libcurl4-openssl-dev libexpat1-dev libz-dev
          git clone --depth 1 --branch "v${GIT_VERSION}" https://github.com/git/git.git /tmp/git-source
          make -C /tmp/git-source -j2 prefix=/opt/git NO_TCLTK=YesPlease install
          /opt/git/bin/git --version
      - name: Verify fixture decisions against Git v${{ steps.git-version.outputs.version }}
        if: steps.previous.outputs.skip != 'true'
        run: PATH="/opt/git/bin:${PATH}" go test -run '^TestGitCheckIgnoreCompatibility$' -count=1 ./...
